<!DOCTYPE html>
<html>
<head>
    <title>Modifier un événement</title>
</head>
<body>
    <h1>Modifier un événement</h1>

    <form>
        <p>Nom de l'événement :</p>
        <input type="text">

        <p>Date :</p>
        <input type="date">

        <p>Lieu :</p>
        <input type="text">

        <p>Artistes :</p>

        <p>Événement annulé :</p>
        <input type="checkbox">

        <p><button>Enregistrer</button></p>
    </form>
</body>
</html>
