<!DOCTYPE html>
<html>
<head>
    <title>Gestion des événements</title>
</head>
<body>
    <h1>Modifier un événement</h1>

    <p>Nom de l'événement :</p>
    <input type="text">

    <p>Modifier le lieu :</p>
    <input type="text" id="lieu">

    <p>Statut de l'événement :</p>
    <select id="statut">
        <option>Maintenu</option>
        <option>Annulé</option>
    </select>

    <p>
        <button onclick="modifier()">Enregistrer</button>
    </p>

    <h2>Informations de l'événement</h2>
    <p id="resultat"></p>

    <script>
        function modifier() {
            let lieu = document.getElementById("lieu").value;
            let statut = document.getElementById("statut").value;

            document.getElementById("resultat").innerHTML =
                "Lieu : " + lieu + "<br>Statut : " + statut;
        }
    </script>
</body>
</html>
