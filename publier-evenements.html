<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Publier un événement</title>
</head>
<body>

    <h1>Créer un événement</h1>

    <form>

        <label for="titre">Titre de l'événement :</label><br>
        <input type="text" id="titre" required><br><br>

        <label for="date">Date :</label><br>
        <input type="date" id="date" required><br><br>

        <label for="lieu">Lieu :</label><br>
        <input type="text" id="lieu" required><br><br>

        <label for="description">Description :</label><br>
        <textarea id="description" required></textarea><br><br>

        <label for="places">Nombre de places :</label><br>
        <input type="number" id="places" min="1" required><br><br>

        <button type="submit">Publier l'événement</button>

    </form>

</body>
</html>
